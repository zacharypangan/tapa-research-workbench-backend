[project]
name = "tapa-research-workbench-backend"
version = "0.1.0"
description = "FastAPI backend for the Tapa Research Workbench repository, extraction, search, and observations modules"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=0.9.2",
    "fastapi>=0.129.0",
    "hdbscan>=0.8.41",
    "httpx>=0.28.1",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "shapely>=2.1.2",
    "uvicorn>=0.41.0",
    "cldfzenodo>=1.3.0",
    "redis>=7.3.0",
    "pypdf>=6.0.0",
    "python-pptx>=1.0.2",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "striprtf",
    "PyMuPDF",
]
