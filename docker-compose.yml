services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      # Override REDIS_URL to point to the local redis container in compose
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/research_workbench
      - AUTH_DISABLED=${AUTH_DISABLED:-true}
      - APP_ENV=${APP_ENV:-development}
      - CLERK_ISSUER=${CLERK_ISSUER:-}
      - CLERK_ORGANIZATION_ID=${CLERK_ORGANIZATION_ID:-}
      - CLERK_AUTHORIZED_PARTIES=${CLERK_AUTHORIZED_PARTIES:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
      - REPOSITORY_ALLOWED_LINK_HOSTS=${REPOSITORY_ALLOWED_LINK_HOSTS:-}
      - PORT=${PORT:-8000}
      - REPOSITORY_OLLAMA_BASE_URL=${REPOSITORY_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - OLLAMA_RETRIEVAL_MODEL=${OLLAMA_RETRIEVAL_MODEL:-llama3.1}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-llava}
      - GOVERNANCE_ENABLED=${GOVERNANCE_ENABLED:-true}
      - GOVERNANCE_ROOT=/governance
    volumes:
      - ./storage:/app/storage
      - ../../../Data Governance:/governance:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=research_workbench
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_workbench"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
